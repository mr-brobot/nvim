services:
  llama-fim:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-fim
    restart: unless-stopped
    ports:
      - "127.0.0.1:8012:8012"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    command: >
      --fim-qwen-7b-default
      --host 0.0.0.0 --port 8012
      -ngl 99 -c 8192 -fa on --cache-reuse 256
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8012/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
